name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build (onefile, windowed)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed goods_cost_manager.py --name GoodsCostManager

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoodsCostManager-windows-exe
          path: dist/GoodsCostManager.exe
          if-no-files-found: error
