name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build (onefile, windowed)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed goods_cost_manager.py --name GoodsCostManager

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoodsCostManager.exe
